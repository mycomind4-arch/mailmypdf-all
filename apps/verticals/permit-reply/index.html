        "@type": "Question",
        "name": "How long do I have to respond to a permit denial or correction notice?",
        "acceptedAnswer": { "@type": "Answer", "text": "Permit response deadlines vary by jurisdiction and notice type. A plan review correction notice typically gives 180 days to resubmit. A failed inspection may require correction within 30 to 60 days. A zoning violation notice may have a shorter compliance period. The deadline is printed on the notice — do not wait. Permit Reply helps you identify and meet the deadline, but does not provide legal advice." }
      },
      {
        "@type": "Question",
        "name": "What should I include in my response to a permit authority notice?",
        "acceptedAnswer": { "@type": "Answer", "text": "Your response should address each issue raised in the notice. For a permit denial, state why the denial should be reconsidered and cite the applicable code section. For plan review comments, explain how each comment has been addressed in the revised plans. For a failed inspection, describe the corrections made and request reinspection. Include revised plans, engineering reports, code references, photos, and correspondence as supporting documentation." }
      },
      {
        "@type": "Question",
        "name": "Does Permit Reply provide legal advice?",
        "acceptedAnswer": { "@type": "Answer", "text": "No. Permit Reply is a document and correspondence tool, not a law firm, engineering firm, or permit expediting service. It helps you organize your facts, prepare a written response, and mail it with proof of delivery. Building codes and zoning regulations vary by jurisdiction. For complex permit disputes, consult a land use attorney, licensed engineer, or permit expediter familiar with your local building department." }
      },
      {
        "@type": "Question",
        "name": "What happens if I don't respond to a permit correction notice?",
        "acceptedAnswer": { "@type": "Answer", "text": "Failing to respond can result in the permit being revoked, the application being closed, or additional penalties. For zoning violations, non-response can lead to fines, liens, or enforcement action. For failed inspections, non-correction can result in a stop-work order. Always respond in writing and keep proof of your response — certified mail provides that proof." }
      },
