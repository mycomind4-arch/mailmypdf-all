  <!-- Structured Data: FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is Claim Proof?",
        "acceptedAnswer": { "@type": "Answer", "text": "Claim Proof is a document and correspondence tool that helps you respond to claim denials — insurance, benefits, disability, unemployment, and more. You upload the denial letter, the system extracts the key facts, deadlines, and evidence requirements, and you prepare a documented response with supporting proof. The response is mailed via certified mail with tracking and delivery confirmation." }
      },
      {
        "@type": "Question",
        "name": "How long do I have to respond to a claim denial?",
        "acceptedAnswer": { "@type": "Answer", "text": "Most claim denials include an appeal deadline, typically 30 to 90 days. The deadline varies by claim type and jurisdiction. Insurance denials often allow 30 to 60 days for appeal. SSDI and SSI denials give 60 days. Unemployment denials vary by state. The deadline is printed on your denial letter — do not wait to respond." }
      },
      {
        "@type": "Question",
        "name": "What should I include in my claim appeal?",
        "acceptedAnswer": { "@type": "Answer", "text": "Your appeal should address each reason for denial stated in the letter. Include supporting documentation such as medical records, policy language, correspondence, photographs, expert opinions, or payment records. Explain why the denial is incorrect and cite the specific policy provision or law that supports your claim. Be factual, specific, and organized." }
      },
      {
        "@type": "Question",
        "name": "Does Claim Proof provide legal advice?",
        "acceptedAnswer": { "@type": "Answer", "text": "No. Claim Proof is a document and correspondence tool, not a law firm or claims adjuster. It helps you organize your facts, prepare a written response, and mail it with proof of delivery. For complex claims involving significant amounts or legal rights, consider consulting a licensed attorney in your jurisdiction." }
      },
      {
        "@type": "Question",
        "name": "What happens if I miss the appeal deadline?",
        "acceptedAnswer": { "@type": "Answer", "text": "Missing the appeal deadline can result in the denial becoming final, meaning you lose the right to challenge the decision through the normal appeals process. Some jurisdictions allow late appeals for good cause, but this is not guaranteed. If your deadline has passed, respond as soon as possible and explain the delay — some agencies and insurers will still consider a late appeal." }
      },
      {
        "@type": "Question",
        "name": "Can I send my appeal with tracking?",
        "acceptedAnswer": { "@type": "Answer", "text": "Yes. Certified mail with return receipt is the recommended method for sending a claim appeal. It provides proof of mailing and proof of delivery — your record that the appeal was submitted on time. Claim Proof offers certified mail as a mailing option, with tracking and delivery confirmation included." }
      }
    ]
  }
  </script>
