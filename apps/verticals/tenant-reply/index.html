      {
        "@type": "Question",
        "name": "What is Tenant Reply?",
        "acceptedAnswer": { "@type": "Answer", "text": "Tenant Reply is a document and correspondence tool that helps tenants respond to landlord notices — eviction notices, pay-or-quit, cure-or-quit, lease violations, repair demands, habitability complaints, and security deposit disputes. You upload the notice, the system extracts the key facts, deadlines, and legal requirements, and you prepare a documented response. The response is mailed via certified mail with tracking and delivery confirmation." }
      },
      {
        "@type": "Question",
        "name": "How long do I have to respond to an eviction notice?",
        "acceptedAnswer": { "@type": "Answer", "text": "Eviction notice response deadlines vary by state and notice type. A 3-day pay-or-quit typically gives 3 days to pay or respond. A 30-day or 60-day termination notice gives you that period to respond or vacate. Some states require a written response before the landlord can file an unlawful detainer. The deadline is on the notice — do not wait. Tenant Reply helps you identify and meet the deadline, but does not provide legal advice." }
      },
      {
        "@type": "Question",
        "name": "What should I include in my response to a landlord notice?",
        "acceptedAnswer": { "@type": "Answer", "text": "Your response should address each issue raised in the notice. For a pay-or-quit, state whether you are paying, disputing the amount, or requesting time. For a cure-or-quit, explain how you have corrected the violation or dispute the allegation. For a repair demand, describe the habitability issue and request specific repairs. Include relevant documentation such as lease terms, correspondence, photos, repair requests, and payment records." }
      },
      {
        "@type": "Question",
        "name": "Does Tenant Reply provide legal advice?",
        "acceptedAnswer": { "@type": "Answer", "text": "No. Tenant Reply is a document and correspondence tool, not a law firm or tenant advocacy organization. It helps you organize your facts, prepare a written response, and mail it with proof of delivery. Eviction and housing law varies significantly by state and jurisdiction. For matters involving eviction proceedings, consult a tenant rights attorney or local legal aid organization." }
      },
      {
        "@type": "Question",
        "name": "What happens if I don't respond to a landlord notice?",
        "acceptedAnswer": { "@type": "Answer", "text": "Failing to respond to a landlord notice can have serious consequences. For eviction notices, non-response can lead to an unlawful detainer filing and a default judgment against you. For repair demands, non-response may be used to argue you waived the issue. For lease violations, non-response may be treated as acceptance. Always respond in writing and keep proof of your response — certified mail provides that proof." }
      },
      {
        "@type": "Question",
        "name": "Can I send my tenant response with tracking?",
        "acceptedAnswer": { "@type": "Answer", "text": "Yes. Certified mail with return receipt is the recommended method for sending a tenant response. It provides proof of mailing and proof of delivery — your record that the response was submitted on time. Tenant Reply offers certified mail as a mailing option, with tracking and delivery confirmation included." }
      }
    ]
  }
