<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Organized criminal defense case file</title>
  <desc id="desc">A dark evidence board with a vehicle file, timeline, and linked evidence cards.</desc>
