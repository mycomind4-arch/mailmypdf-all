name: Prune merged and fully incorporated branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-merged-branches.yml"
      - ".github/scripts/prune_merged_branches.py"
      - ".github/scripts/reviewed_branch_retirements.json"
      - ".github/scripts/test_prune_merged_branches.py"
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mailmypdf-safe-branch-pruner
  cancel-in-progress: false

jobs:
  prune:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify branch preservation and archive guards
        run: python3 -m unittest discover -s .github/scripts -p 'test_prune_merged_branches.py'
      - name: Delete only verified redundant branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prune_merged_branches.py --apply
