name: Integrate Secured Transactions Workspace

# MAINTENANCE / RECOVERY TOOL — manual dispatch only.
#
# This workflow performs a one-shot repository change: it adds the
# "secured-transactions" top-level vertical to pnpm-workspace.yaml and
# regenerates pnpm-lock.yaml, then commits both files directly to main.
# It exists because that change cannot be produced legitimately through
# hand-editing (the lockfile must be generated by pnpm itself).
#
# Do not add push/pull_request triggers to this workflow and do not
# dispatch it routinely — it is intended to run once (or again only if
# the workspace/lockfile genuinely need to be regenerated), not as part
# of ordinary CI.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify secured-transactions/package.json exists
        run: test -f secured-transactions/package.json

      - name: Verify package name is @mailmypdf/secured-transactions-section
        run: |
          NAME=$(node -p "require('./secured-transactions/package.json').name")
          if [ "$NAME" != "@mailmypdf/secured-transactions-section" ]; then
            echo "Unexpected package name: $NAME"
            exit 1
          fi

      - name: Add secured-transactions to pnpm-workspace.yaml if missing
        run: |
          if grep -qE '^\s*-\s*"secured-transactions"\s*$' pnpm-workspace.yaml; then
            echo "secured-transactions is already listed in pnpm-workspace.yaml"
          else
            node -e "
              const fs = require('fs');
              const path = 'pnpm-workspace.yaml';
              const lines = fs.readFileSync(path, 'utf8').split('\n');
              const idx = lines.findIndex((l) => l.trim() === '- \"records-request\"');
              if (idx === -1) throw new Error('Could not find insertion anchor in pnpm-workspace.yaml');
              lines.splice(idx + 1, 0, '  - \"secured-transactions\"');
              fs.writeFileSync(path, lines.join('\n'));
            "
          fi
          cat pnpm-workspace.yaml

      - name: pnpm install --lockfile-only
        run: pnpm install --lockfile-only

      - name: pnpm install --frozen-lockfile (integrity check)
        run: pnpm install --frozen-lockfile

      - name: Build dependencies whose package exports require a dist/ build
        run: |
          pnpm --filter @mailmypdf/core build
          pnpm --filter @mailmypdf/documents build
          pnpm --filter @mailmypdf/mailing-client build
          pnpm --filter @mailmypdf/packet-builder build
          pnpm --filter @mailmypdf/payment-fulfillment build
          pnpm --filter @mailmypdf/proof build
          pnpm --filter @mailmypdf/design-system build
          pnpm --filter @mailmypdf/seo build
          pnpm --filter @mailmypdf/workflows build
          pnpm --filter @mailmypdf/workflow-ui build
          pnpm --filter @mailmypdf/workflow-acceptance build
          pnpm --filter @mailmypdf/intelligence build
          pnpm --filter @mailmypdf/jurisdiction-rules build
          pnpm --filter @mailmypdf/identity-capacity build
          pnpm --filter @mailmypdf/secured-transactions build

      - name: Typecheck and test @mailmypdf/secured-transactions-section (secured-transaction-eligibility scope only)
        run: |
          pnpm --filter @mailmypdf/secured-transactions-section typecheck:eligibility
          pnpm --filter @mailmypdf/secured-transactions-section test:eligibility

      - name: Typecheck and test @mailmypdf/jurisdiction-rules
        run: |
          pnpm --filter @mailmypdf/jurisdiction-rules typecheck
          pnpm --filter @mailmypdf/jurisdiction-rules test

      - name: Typecheck and test @mailmypdf/identity-capacity
        run: |
          pnpm --filter @mailmypdf/identity-capacity typecheck
          pnpm --filter @mailmypdf/identity-capacity test

      - name: Typecheck and test @mailmypdf/secured-transactions
        run: |
          pnpm --filter @mailmypdf/secured-transactions typecheck
          pnpm --filter @mailmypdf/secured-transactions test

      - name: Inspect what changed
        run: |
          git diff --check
          git status --short
          git diff -- pnpm-workspace.yaml pnpm-lock.yaml

      - name: Fail if anything beyond the workspace file and lockfile changed
        run: |
          CHANGED=$(git status --porcelain | awk '{print $2}')
          for f in $CHANGED; do
            if [ "$f" != "pnpm-workspace.yaml" ] && [ "$f" != "pnpm-lock.yaml" ]; then
              echo "Unexpected change outside pnpm-workspace.yaml / pnpm-lock.yaml: $f"
              exit 1
            fi
          done

      - name: Commit and push workspace + lockfile changes
        run: |
          if git diff --quiet -- pnpm-workspace.yaml pnpm-lock.yaml; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-workspace.yaml pnpm-lock.yaml
          git commit -m "chore(workspace): integrate secured-transactions section"
          git push origin HEAD:main
