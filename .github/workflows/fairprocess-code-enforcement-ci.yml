name: FairProcess Code Enforcement CI

on:
  push:
    branches:
      - feature/fairprocess-code-enforcement-core
    paths:
      - 'apps/verticals/code-enforcement/**'
      - '.github/workflows/fairprocess-code-enforcement-ci.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Code Enforcement
        run: pnpm --filter code-enforcement typecheck

      - name: Run FairProcess tests
        run: pnpm --filter code-enforcement exec vitest run src/fairprocess
