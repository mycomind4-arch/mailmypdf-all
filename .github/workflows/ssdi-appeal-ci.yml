name: SSDI Appeal verification

on:
  push:
    branches: [main]
    paths:
      - 'appeal-mail/**'
      - 'packages/documents/**'
      - 'packages/document-intelligence/**'
      - 'packages/ai/**'
      - 'packages/intelligence/**'
      - 'packages/workflows/**'
      - 'packages/step-workflow/**'
      - 'packages/workflow-ui/**'
      - 'packages/forms/**'
      - 'packages/packet-builder/**'
      - 'packages/pricing/**'
      - 'packages/payment-fulfillment/**'
      - 'packages/fulfillment/**'
      - 'packages/proof/**'
      - 'packages/workflow-acceptance/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ssdi-appeal-ci.yml'
  pull_request:
    paths:
      - 'appeal-mail/**'
      - 'packages/documents/**'
      - 'packages/document-intelligence/**'
      - 'packages/ai/**'
      - 'packages/intelligence/**'
      - 'packages/workflows/**'
      - 'packages/step-workflow/**'
      - 'packages/workflow-ui/**'
      - 'packages/forms/**'
      - 'packages/packet-builder/**'
      - 'packages/pricing/**'
      - 'packages/payment-fulfillment/**'
      - 'packages/fulfillment/**'
      - 'packages/proof/**'
      - 'packages/workflow-acceptance/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ssdi-appeal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build Appeal Mail workspace dependencies
        run: |
          pnpm --filter @mailmypdf/design-system build
          pnpm --filter @mailmypdf/seo build
          pnpm --filter @mailmypdf/ai build
          pnpm --filter @mailmypdf/forms build
          pnpm --filter @mailmypdf/workflows build
          pnpm --filter @mailmypdf/workflow-ui build
      - name: Unit tests
        run: pnpm --filter @mailmypdf/appeal-mail test
      - name: Typecheck Appeal Mail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          output="$(pnpm --filter @mailmypdf/appeal-mail typecheck 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            body="$(printf '%s\n' "$output" | tail -c 50000 | jq -Rs .)"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -d "{\"body\":$body}"
          fi
          exit "$status"
      - name: SSDI acceptance
        run: pnpm --filter @mailmypdf/appeal-mail test:acceptance
