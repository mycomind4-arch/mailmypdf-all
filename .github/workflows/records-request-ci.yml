name: Records Request verification

on:
  push:
    branches: [main]
    paths:
      - 'records-request/**'
      - 'packages/workflows/**'
      - 'packages/workflow-ui/**'
      - 'packages/packet-builder/**'
      - 'packages/payment-fulfillment/**'
      - 'packages/proof/**'
      - 'packages/design-system/**'
      - 'packages/seo/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/records-request-ci.yml'
  pull_request:
    paths:
      - 'records-request/**'
      - 'packages/workflows/**'
      - 'packages/workflow-ui/**'
      - 'packages/packet-builder/**'
      - 'packages/payment-fulfillment/**'
      - 'packages/proof/**'
      - 'packages/design-system/**'
      - 'packages/seo/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  records-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build Records Request dependencies
        run: |
          pnpm --filter @mailmypdf/core build
          pnpm --filter @mailmypdf/documents build
          pnpm --filter @mailmypdf/mailing-client build
          pnpm --filter @mailmypdf/packet-builder build
          pnpm --filter @mailmypdf/payment-fulfillment build
          pnpm --filter @mailmypdf/proof build
          pnpm --filter @mailmypdf/design-system build
          pnpm --filter @mailmypdf/seo build
          pnpm --filter @mailmypdf/ai build
          pnpm --filter @mailmypdf/workflows build
          pnpm --filter @mailmypdf/workflow-ui build
      - name: Unit tests
        run: pnpm --filter @mailmypdf/records-request test
      - name: Typecheck
        run: pnpm --filter @mailmypdf/records-request typecheck
      - name: Acceptance
        run: pnpm --filter @mailmypdf/records-request test:acceptance

