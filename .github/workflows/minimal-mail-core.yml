name: Minimal Mail Core Tests
on:
  pull_request:
    paths:
      - 'rebuild/mail-core/**'
      - '.github/workflows/minimal-mail-core.yml'
  push:
    branches:
      - 'rebuild/minimal-mail-core-20261111'
    paths:
      - 'rebuild/mail-core/**'
      - '.github/workflows/minimal-mail-core.yml'
permissions:
  contents: read
jobs:
  mock-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mock-only security and transaction regressions
        run: node --test rebuild/mail-core/test/*.test.mjs
