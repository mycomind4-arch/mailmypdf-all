name: Minimal Mail Core Tests
on:
  pull_request:
    paths:
      - 'rebuild/mail-core/**'
      - 'mailmypdf/src/lib/secure-core/approved-order-binding.ts'
      - 'mailmypdf/src/lib/secure-core/workflow-checkout.server.ts'
      - 'mailmypdf/tests/approved-order-binding.test.ts'
      - 'mailmypdf/src/lib/orders.functions.ts'
      - 'mailmypdf/tests/checkout-claim-race.test.mjs'
      - 'mailmypdf/tests/checkout-boundary.test.mjs'
      - 'mailmypdf/src/lib/feature-flags.ts'
      - 'mailmypdf/tests/feature-flags-admin.test.mjs'
      - 'mailmypdf/tests/secure-workflow-fulfillment.test.mjs'
      - '.github/workflows/minimal-mail-core.yml'
  push:
    branches:
      - 'rebuild/minimal-mail-core-20261111'
    paths:
      - 'rebuild/mail-core/**'
      - 'mailmypdf/src/lib/secure-core/approved-order-binding.ts'
      - 'mailmypdf/src/lib/secure-core/workflow-checkout.server.ts'
      - 'mailmypdf/tests/approved-order-binding.test.ts'
      - 'mailmypdf/src/lib/orders.functions.ts'
      - 'mailmypdf/tests/checkout-claim-race.test.mjs'
      - 'mailmypdf/tests/checkout-boundary.test.mjs'
      - 'mailmypdf/src/lib/feature-flags.ts'
      - 'mailmypdf/tests/feature-flags-admin.test.mjs'
      - 'mailmypdf/tests/secure-workflow-fulfillment.test.mjs'
      - '.github/workflows/minimal-mail-core.yml'
permissions:
  contents: read
jobs:
  mock-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mock-only security and transaction regressions
        run: node --test rebuild/mail-core/test/*.test.mjs
      - name: Verify authenticated workflow checkout binding
        run: node --experimental-strip-types --test mailmypdf/tests/approved-order-binding.test.ts
      - name: Verify direct-mail checkout ownership race and fulfillment boundaries
        run: node --test mailmypdf/tests/checkout-claim-race.test.mjs mailmypdf/tests/checkout-boundary.test.mjs mailmypdf/tests/payment-fulfillment-boundary.test.mjs mailmypdf/tests/secure-workflow-fulfillment.test.mjs mailmypdf/tests/feature-flags-admin.test.mjs
