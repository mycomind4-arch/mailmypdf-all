name: Reference journey offline acceptance

on:
  pull_request:
    paths:
      - "packages/workflows/**"
      - "mailmypdf/src/lib/mcp/**"
      - "mailmypdf/src/routes/api.studio.workflows.readiness.ts"
      - "mailmypdf/src/lib/studio-command-center.functions.ts"
      - "mailmypdf/src/components/studio-command-center.tsx"
      - "mailmypdf/tests/factory-graduation-wiring.test.ts"
      - "mailmypdf/tests/mcp-conversational-letter-e2e-harness.test.mjs"
      - "mailmypdf/tests/mcp-direct-mail.test.ts"
      - "mailmypdf/tests/notice-workflow-factory.test.ts"
      - "mailmypdf/tests/records-request-draft-runtime.test.ts"
      - ".github/workflows/reference-journeys-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/workflows/**"
      - "mailmypdf/src/lib/mcp/**"
      - "mailmypdf/src/routes/api.studio.workflows.readiness.ts"
      - "mailmypdf/src/lib/studio-command-center.functions.ts"
      - "mailmypdf/src/components/studio-command-center.tsx"
      - "mailmypdf/tests/factory-graduation-wiring.test.ts"
      - "mailmypdf/tests/mcp-conversational-letter-e2e-harness.test.mjs"
      - "mailmypdf/tests/mcp-direct-mail.test.ts"
      - "mailmypdf/tests/notice-workflow-factory.test.ts"
      - "mailmypdf/tests/records-request-draft-runtime.test.ts"
      - ".github/workflows/reference-journeys-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reference-journeys:
    name: Test letter, CP14, and records-request reference journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared workflow and MCP dependencies
        run: pnpm --filter ./mailmypdf run prebuild
      - name: Verify workflow factory graduation and certified chat schemas
        run: pnpm --filter @mailmypdf/workflows test
      - name: Verify all three reference journeys against live connector tool declarations
        run: pnpm --filter ./mailmypdf exec tsx --test tests/factory-graduation-wiring.test.ts tests/mcp-connector.test.ts tests/notice-workflow-factory.test.ts tests/records-request-draft-runtime.test.ts
      - name: Verify guarded conversational mailing mocks
        run: |
          node --test mailmypdf/tests/mcp-conversational-letter-e2e-harness.test.mjs
          pnpm --filter ./mailmypdf exec node --experimental-test-module-mocks --import tsx --test tests/mcp-direct-mail.test.ts
      - name: Document simulation boundary
        if: success()
        run: |
          echo "Offline reference journey acceptance: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "No real payment, provider dispatch, delivery, or production certificate was exercised." >> "$GITHUB_STEP_SUMMARY"
