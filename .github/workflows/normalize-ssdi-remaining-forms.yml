name: Finalize SSDI normalized form migration

on:
  push:
    paths:
      - ".github/workflows/normalize-ssdi-remaining-forms.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Point SSDI at pre-normalized bundled forms
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path("appeal-mail/workflows/appeal-ssdi-denial/start/workflow.ts")
          text = workflow.read_text()
          text = text.replace('bundledMailReadyFilename: "ssa-3441.pdf"', 'bundledMailReadyFilename: "ssa-3441.normalized.pdf"', 1)
          text = text.replace('bundledMailReadyFilename: "ssa-827.pdf"', 'bundledMailReadyFilename: "ssa-827.normalized.pdf"', 1)
          workflow.write_text(text)

          test = Path("packages/packet-builder/tests/ssdi-new-architecture.test.ts")
          text = test.read_text()
          text = text.replace('  normalizeTrustedStaticPdfForMailing,\n', '', 1)
          helper_start = text.index('async function normalizeBundledForm(')
          helper_end = text.index('\nfunction packetRow(', helper_start)
          text = text[:helper_start] + text[helper_end + 1:]
          text = text.replace('  // Normalize sequentially so a malformed official form is identified by\n  // name in CI instead of being hidden by Promise.all\'s first rejection.\n', '')
          text = text.replace('const ssa3441 = await normalizeBundledForm("SSA-3441", "ssa-3441.pdf");', 'const ssa3441 = await loadForm("ssa-3441.normalized.pdf");', 1)
          text = text.replace('const ssa827 = await normalizeBundledForm("SSA-827", "ssa-827.pdf");', 'const ssa827 = await loadForm("ssa-827.normalized.pdf");', 1)
          test.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appeal-mail/workflows/appeal-ssdi-denial/start/workflow.ts \
                  packages/packet-builder/tests/ssdi-new-architecture.test.ts
          git rm .github/workflows/normalize-ssdi-remaining-forms.yml
          git commit -m "fix: use mail-ready SSDI form assets"
          git push origin HEAD:main
