name: Normalize trusted workflow assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalize-trusted-workflow-assets.yml"
      - "pnpm-workspace.yaml"
      - "appeal-mail/package.json"
      - "appeal-mail/workflows/appeal-ssdi-denial/forms/generated/ssa-561-u2.pdf"
      - "appeal-mail/workflows/appeal-ssdi-denial/forms/generated/ssa-3441.pdf"
      - "appeal-mail/workflows/appeal-ssdi-denial/forms/generated/ssa-827.pdf"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: normalize-trusted-workflow-assets
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Refresh workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Normalize trusted SSA PDFs
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gs >/dev/null 2>&1 || ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ghostscript poppler-utils
          fi

          dir="appeal-mail/workflows/appeal-ssdi-denial/forms/generated"
          for source in ssa-561-u2.pdf ssa-3441.pdf ssa-827.pdf; do
            output="${source%.pdf}.normalized.pdf"
            tmp="${dir}/.${output}.tmp.pdf"
            gs -q -dSAFER -dBATCH -dNOPAUSE \
              -sDEVICE=pdfwrite \
              -dCompatibilityLevel=1.7 \
              -dDetectDuplicateImages=true \
              -dCompressFonts=true \
              -sOutputFile="$tmp" \
              "${dir}/${source}"
            mv "$tmp" "${dir}/${output}"
            pdfinfo "${dir}/${output}" | grep -q '^Encrypted:[[:space:]]*no$'
          done

      - name: Open pull request for generated changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml appeal-mail/workflows/appeal-ssdi-denial/forms/generated/*.normalized.pdf
          if git diff --cached --quiet; then
            echo "Trusted assets and lockfile are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reuse one automation-owned PR branch instead of making a new branch
          # for every run. A lease prevents overwriting concurrent/manual edits.
          branch="automation/normalize-trusted-workflow-assets"
          remote_ref="refs/heads/${branch}"
          previous_sha="$(git ls-remote --heads origin "$remote_ref" | cut -f1)"

          git switch -C "$branch"
          git commit -m "build: normalize trusted SSA forms and workspace lock"
          if [[ -n "$previous_sha" ]]; then
            git push --force-with-lease="${remote_ref}:${previous_sha}" origin "HEAD:${remote_ref}"
          else
            git push origin "HEAD:${remote_ref}"
          fi

          # Updating the stable branch updates its open PR in place.
          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Updated existing normalization PR #${existing_pr}."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "build: normalize trusted SSA forms and workspace lock" \
              --body "Automated normalization detected generated SSA PDF and/or pnpm lockfile changes. Review the generated output before merging."
          fi
