name: Normalize bundled SSA-561

on:
  push:
    paths:
      - ".github/workflows/normalize-ssa-561.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript
      - name: Rewrite bundled SSA-561 as static PDF
        run: |
          mkdir -p /tmp/ssa-normalized
          gs -q -dSAFER -dBATCH -dNOPAUSE -sDEVICE=pdfwrite -dCompatibilityLevel=1.7 \
            -dDetectDuplicateImages=true -dCompressFonts=true \
            -sOutputFile=/tmp/ssa-normalized/ssa-561-u2.normalized.pdf \
            appeal-mail/workflows/appeal-ssdi-denial/forms/generated/ssa-561-u2.pdf
          test -s /tmp/ssa-normalized/ssa-561-u2.normalized.pdf
      - name: Commit normalized SSDI asset
        run: |
          cp /tmp/ssa-normalized/ssa-561-u2.normalized.pdf \
            appeal-mail/workflows/appeal-ssdi-denial/forms/generated/ssa-561-u2.normalized.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appeal-mail/workflows/appeal-ssdi-denial/forms/generated/ssa-561-u2.normalized.pdf
          if git diff --cached --quiet; then
            echo "Normalized SSA-561 already committed."
          else
            git commit -m "fix: add mail-ready normalized SSA-561"
            git push origin HEAD:main
          fi
