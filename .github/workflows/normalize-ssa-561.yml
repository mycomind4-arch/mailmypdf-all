name: Finalize normalized SSA-561 migration

on:
  push:
    paths:
      - ".github/workflows/normalize-ssa-561.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Point SSDI acceptance at mail-ready SSA-561 and remove this migration job
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/packet-builder/tests/ssdi-new-architecture.test.ts")
          text = path.read_text()
          old = 'const ssa561 = await normalizeBundledForm("SSA-561", "ssa-561-u2.pdf");'
          new = 'const ssa561 = await loadForm("ssa-561-u2.normalized.pdf");'
          if old not in text:
              raise SystemExit("expected SSDI SSA-561 normalization line not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/packet-builder/tests/ssdi-new-architecture.test.ts
          git rm .github/workflows/normalize-ssa-561.yml
          git commit -m "test: use mail-ready SSA-561 asset"
          git push origin HEAD:main
