name: Workspace UI verification

on:
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'
      - 'packages/workflow-ui/**'
      - 'packages/workflows/**'
      - 'mailmypdf/**'
      - 'appeal-mail/**'
      - 'benefits-appeal/**'
      - 'claim-proof/**'
      - 'code-enforcement/**'
      - 'dispute-mail/**'
      - 'immigration-mail/**'
      - 'insurance-claims/**'
      - 'legal-defense/**'
      - 'notice-respond/**'
      - 'permit-reply/**'
      - 'private-office/**'
      - 'records-request/**'
      - 'secured-transactions/**'
      - 'small-business/**'
      - 'tenant-reply/**'
      - 'scripts/verify-product-topology.mjs'
      - 'scripts/*workflow*'
      - 'docs/migrations/legacy-workflow-inventory.json'
      - '.github/workflows/workspace-ui-ci.yml'
  pull_request:
    paths:
      - 'packages/design-system/**'
      - 'packages/workflow-ui/**'
      - 'packages/workflows/**'
      - 'mailmypdf/**'
      - 'appeal-mail/**'
      - 'benefits-appeal/**'
      - 'claim-proof/**'
      - 'code-enforcement/**'
      - 'dispute-mail/**'
      - 'immigration-mail/**'
      - 'insurance-claims/**'
      - 'legal-defense/**'
      - 'notice-respond/**'
      - 'permit-reply/**'
      - 'private-office/**'
      - 'records-request/**'
      - 'secured-transactions/**'
      - 'small-business/**'
      - 'tenant-reply/**'
      - 'scripts/verify-product-topology.mjs'
      - 'scripts/*workflow*'
      - 'docs/migrations/legacy-workflow-inventory.json'
      - '.github/workflows/workspace-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-registry:
    name: Canonical workflow registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./mailmypdf run prebuild
      - run: node scripts/verify-product-topology.mjs
      - run: node --test scripts/workflow-registry-topology.test.mjs
      - run: pnpm registry:check
      - run: pnpm --filter @mailmypdf/workflows test
      - name: Verify every projection and preserve existing executable workflows
        run: |
          pnpm --filter ./mailmypdf exec tsx --test \
            tests/workflow-registry.test.ts tests/workflow-projections.test.ts \
            tests/workflow-seo-canonicalization.test.ts tests/workflow-legacy-aliases.test.ts

  design-system:
    name: Design system typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Verify canonical product topology
        run: node scripts/verify-product-topology.mjs
      - name: Typecheck shared UI packages
        run: |
          pnpm --filter @mailmypdf/design-system typecheck
          pnpm --filter @mailmypdf/workflow-ui typecheck

  domain-engines:
    name: Domain engine verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build domain engine dependencies
        run: |
          pnpm --filter @mailmypdf/identity-capacity... \
            --filter @mailmypdf/jurisdiction-rules... \
            --filter @mailmypdf/registry-adapters... \
            --filter @mailmypdf/secured-transactions... \
            --workspace-concurrency=2 run build
      - name: Test identity, jurisdiction, registry, and secured-transaction engines
        run: |
          pnpm --filter @mailmypdf/identity-capacity test
          pnpm --filter @mailmypdf/jurisdiction-rules test
          pnpm --filter @mailmypdf/registry-adapters test
          pnpm --filter @mailmypdf/secured-transactions test

  authority-gate:
    name: Workflow SEO Authority Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build MCP document-ingress and canonical registry dependencies
        run: pnpm --filter @mailmypdf/documents... --filter @mailmypdf/workflows... --workspace-concurrency=2 run build
      - name: Test Authority Gate and catalog topology invariants
        run: pnpm --filter ./mailmypdf exec tsx --test tests/workflow-authority-gate.test.ts tests/workflow-seo-topology.test.ts tests/mcp-connector.test.ts
      - name: Verify MCP document E2E safety interlocks
        run: node --test mailmypdf/tests/mcp-document-e2e-harness.test.mjs
      - name: Verify portable MailMyPDF plugin package
        run: node --test mailmypdf/tests/plugin-package.test.mjs
      - name: Verify OpenAI domain challenge behavior
        run: pnpm --filter ./mailmypdf exec tsx --test tests/openai-domain-challenge.test.ts
      - name: Reject thin or unverified indexable workflow pages
        run: pnpm --filter ./mailmypdf seo:authority:validate
      - name: Verify secure workflow payment-to-mailing invariants
        run: node --test mailmypdf/tests/secure-workflow-fulfillment.test.mjs
      - name: Build secure workflow package dependencies
        run: pnpm --filter ./mailmypdf run prebuild
      - name: Verify executable notice workflow runtimes
        id: notice-runtime-tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter ./mailmypdf exec tsx --test \
            tests/workflow-runtime.test.ts \
            tests/notice-response-workflow.test.ts \
            tests/notice-workflow-factory.test.ts \
            tests/records-request-draft-runtime.test.ts \
            2>&1 | tee notice-runtime-tests.log
      - name: Upload executable notice runtime diagnostics
        if: failure() && steps.notice-runtime-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: executable-notice-runtime-diagnostics
          path: notice-runtime-tests.log
          if-no-files-found: error
          retention-days: 7

  build-core:
    name: Build mailmypdf core
    runs-on: ubuntu-latest
    needs: [authority-gate, workflow-registry]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Verify production payment, fulfillment, and evidence rails
        run: |
          pnpm --filter @mailmypdf/fulfillment test
          pnpm --filter @mailmypdf/payment-fulfillment test
          node --test             mailmypdf/tests/lob-hardening.test.mjs             mailmypdf/tests/stripe-production.test.mjs             mailmypdf/tests/payment-fulfillment-boundary.test.mjs             mailmypdf/tests/webhook-security.test.mjs
          pnpm --filter ./mailmypdf exec tsx --test tests/mailing-record.test.ts
      - name: Build core app
        run: pnpm --filter ./mailmypdf build

  build-consumers:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - appeal-mail
          - benefits-appeal
          - claim-proof
          - code-enforcement
          - dispute-mail
          - immigration-mail
          - insurance-claims
          - legal-defense
          - notice-respond
          - permit-reply
          - private-office
          - records-request
          - secured-transactions
          - small-business
          - tenant-reply
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build root section package when present
        shell: bash
        run: |
          section="${{ matrix.app }}"
          if [[ ! -f "${section}/package.json" ]]; then
            echo "${section} is host-mounted and is validated by the MailMyPDF core build."
            exit 0
          fi
          package_name=$(node -p "require('./${section}/package.json').name")
          pnpm --filter "${package_name}^..." --workspace-concurrency=2 run build
          pnpm --filter "${package_name}" run build
