name: Workspace UI verification

on:
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'
      - 'apps/mailmypdf/**'
      - 'apps/verticals/**'
      - 'scripts/verify-product-topology.mjs'
      - '.github/workflows/workspace-ui-ci.yml'
  pull_request:
    paths:
      - 'packages/design-system/**'
      - 'apps/mailmypdf/**'
      - 'apps/verticals/**'
      - 'scripts/verify-product-topology.mjs'
      - '.github/workflows/workspace-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system:
    name: Design system typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Verify canonical product topology
        run: node scripts/verify-product-topology.mjs
      - name: Typecheck design system
        run: pnpm --filter @mailmypdf/design-system typecheck

  authority-gate:
    name: Workflow SEO Authority Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Test Authority Gate and catalog topology invariants
        run: pnpm --filter ./apps/mailmypdf exec tsx --test tests/workflow-authority-gate.test.ts tests/workflow-seo-topology.test.ts
      - name: Reject thin or unverified indexable workflow pages
        run: pnpm --filter ./apps/mailmypdf seo:authority:validate

  build-core:
    name: Verify mailmypdf core launch gate
    runs-on: ubuntu-latest
    needs: authority-gate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Test core
        run: pnpm --filter ./apps/mailmypdf test
      - name: Lint stabilization surfaces
        id: core-lint
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter ./apps/mailmypdf lint:launch 2>&1 | tee core-lint.log
      - name: Upload core lint diagnostics
        if: failure() && steps.core-lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mailmypdf-core-lint-diagnostics
          path: core-lint.log
      - name: Typecheck core
        id: core-typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter ./apps/mailmypdf typecheck 2>&1 | tee core-typecheck.log
      - name: Upload core typecheck diagnostics
        if: failure() && steps.core-typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mailmypdf-core-typecheck-diagnostics
          path: core-typecheck.log
      - name: Validate workflow SEO authority
        run: pnpm --filter ./apps/mailmypdf seo:authority:validate
      - name: Build core
        run: pnpm --filter ./apps/mailmypdf build

  build-consumers:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - appeal-mail
          - benefits-appeal
          - claim-proof
          - code-enforcement
          - dispute-mail
          - immigration-mail
          - insurance-claims
          - notice-respond
          - permit-reply
          - private-office
          - records-request
          - small-business
          - tenant-reply
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck code enforcement
        id: code-enforcement-typecheck
        if: matrix.app == 'code-enforcement'
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter ./apps/verticals/code-enforcement typecheck 2>&1 | tee code-enforcement-typecheck.log
      - name: Upload code enforcement typecheck diagnostics
        if: failure() && matrix.app == 'code-enforcement' && steps.code-enforcement-typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: code-enforcement-typecheck-diagnostics
          path: code-enforcement-typecheck.log
      - name: Build app
        run: pnpm --filter ./${{ format('apps/verticals/{0}', matrix.app) }} build
