name: Workspace UI verification

on:
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'
      - 'apps/mailmypdf/**'
      - 'apps/verticals/**'
      - 'scripts/verify-product-topology.mjs'
      - '.github/workflows/workspace-ui-ci.yml'
  pull_request:
    paths:
      - 'packages/design-system/**'
      - 'apps/mailmypdf/**'
      - 'apps/verticals/**'
      - 'scripts/verify-product-topology.mjs'
      - '.github/workflows/workspace-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system:
    name: Design system typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Verify canonical product topology
        run: node scripts/verify-product-topology.mjs
      - name: Typecheck design system
        run: pnpm --filter @mailmypdf/design-system typecheck

  authority-gate:
    name: Workflow SEO Authority Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Test Authority Gate and catalog topology invariants
        run: pnpm --filter ./apps/mailmypdf exec tsx --test tests/workflow-authority-gate.test.ts tests/workflow-seo-topology.test.ts
      - name: Reject thin or unverified indexable workflow pages
        run: pnpm --filter ./apps/mailmypdf seo:authority:validate
      - name: Verify secure workflow payment-to-mailing invariants
        run: node --test apps/mailmypdf/tests/secure-workflow-fulfillment.test.mjs
      - name: Build secure workflow package dependencies
        run: pnpm --filter @mailmypdf/core build && pnpm --filter @mailmypdf/documents build
      - name: Verify executable notice workflow runtimes
        id: notice-runtime-tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter ./apps/mailmypdf exec tsx --test \
            tests/workflow-runtime.test.ts \
            tests/notice-response-workflow.test.ts \
            tests/notice-workflow-factory.test.ts \
            2>&1 | tee notice-runtime-tests.log
      - name: Upload executable notice runtime diagnostics
        if: failure() && steps.notice-runtime-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: executable-notice-runtime-diagnostics
          path: notice-runtime-tests.log
          if-no-files-found: error
          retention-days: 7

  build-core:
    name: Build mailmypdf core
    runs-on: ubuntu-latest
    needs: authority-gate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build core app
        run: pnpm --filter ./apps/mailmypdf build

  build-consumers:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - appeal-mail
          - benefits-appeal
          - claim-proof
          - code-enforcement
          - dispute-mail
          - immigration-mail
          - insurance-claims
          - notice-respond
          - permit-reply
          - private-office
          - records-request
          - small-business
          - tenant-reply
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Test Private Office compound runtime
        if: matrix.app == 'private-office'
        run: |
          pnpm --filter mailmypdf-private-office run build:shared
          pnpm --filter mailmypdf-private-office exec vitest run \
            src/domain/compound-workflows.test.ts \
            src/domain/compound-workflow-runtime.test.ts \
            src/domain/compound-phase-readiness.test.ts \
            src/platform/authority-provider.test.ts \
            src/services/compound-workflow-service.test.ts \
            src/services/compound-capability-executor.test.ts
      - name: Build app
        run: pnpm --filter ./${{ format('apps/verticals/{0}', matrix.app) }} build
