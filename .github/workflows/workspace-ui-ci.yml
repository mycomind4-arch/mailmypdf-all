name: Workspace UI verification

on:
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'
      - 'apps/mailmypdf/**'
      - 'apps/verticals/**'
      - 'scripts/verify-product-topology.mjs'
      - '.github/workflows/workspace-ui-ci.yml'
  pull_request:
    paths:
      - 'packages/design-system/**'
      - 'apps/mailmypdf/**'
      - 'apps/verticals/**'
      - 'scripts/verify-product-topology.mjs'
      - '.github/workflows/workspace-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system:
    name: Design system typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Verify canonical product topology
        run: node scripts/verify-product-topology.mjs
      - name: Typecheck design system
        run: pnpm --filter @mailmypdf/design-system typecheck

  authority-gate:
    name: Workflow SEO Authority Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Reject thin or unverified indexable workflow pages
        run: pnpm --filter ./apps/mailmypdf seo:authority:validate

  build-core:
    name: Build mailmypdf core
    runs-on: ubuntu-latest
    needs: authority-gate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build core app
        run: pnpm --filter ./apps/mailmypdf build

  build-consumers:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - appeal-mail
          - benefits-appeal
          - claim-proof
          - code-enforcement
          - dispute-mail
          - immigration-mail
          - insurance-claims
          - notice-respond
          - permit-reply
          - private-office
          - records-request
          - small-business
          - tenant-reply
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build app
        run: pnpm --filter ./${{ format('apps/verticals/{0}', matrix.app) }} build
