name: MailMyPDF Cloud Agent

on:
  schedule:
    # Once daily, off the hour. GitHub schedules run on UTC.
    - cron: "23 16 * * *"
    # Recheck reviewed PRs without launching another paid model run.
    - cron: "37 */3 * * *"
    # One bounded daily opportunity to improve existing automations.
    - cron: "41 8 * * *"
  workflow_dispatch:
    inputs:
      automation_improvement:
        description: "Run the automation self-improvement pass now instead of a coding issue"
        required: false
        default: false
        type: boolean
      issue_number:
        description: "Optional owner-created [Cloud Agent] issue number; blank selects oldest eligible issue"
        required: false
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: mailmypdf-cloud-agent
  cancel-in-progress: false

jobs:
  build-proposal:
    if: (github.event_name == 'workflow_dispatch' && !inputs.automation_improvement) || github.event.schedule == '23 16 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Select one owner-approved issue (no third-party input)
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          issue="$INPUT_ISSUE"
          if [[ -n "$issue" && ! "$issue" =~ ^[0-9]+$ ]]; then
            echo "::error::issue_number must be a positive integer"
            exit 1
          fi
          # Bounded backlog: never allow more than three open agent PRs.
          active="$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json headRefName | jq '[.[] | select(.headRefName | startswith("cloud-agent/issue-"))] | length')"
          if [[ "$active" -ge 3 ]]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "Three cloud-agent PRs already await review; pausing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$issue" ]]; then
            candidates="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json number,title,author \
              | jq -r --arg owner "$REPO_OWNER" \
                '[.[] | select(.author.login == $owner and (.title | startswith("[Cloud Agent]")))] | sort_by([if (.title | startswith("[Cloud Agent] Workflow:")) then 0 else 1 end, .number]) | .[].number')"
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              found="$(gh pr list -R "$GITHUB_REPOSITORY" --state all \
                --head "cloud-agent/issue-$candidate" --json number | jq 'length')"
              if [[ "$found" == 0 ]]; then
                issue="$candidate"
                break
              fi
            done <<< "$candidates"
          fi
          if [[ -z "$issue" ]]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "No open owner-authored [Cloud Agent] issues." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          item="$(gh issue view "$issue" -R "$GITHUB_REPOSITORY" --json number,title,author,state)"
          if ! jq -e --arg owner "$REPO_OWNER" \
            '.state == "OPEN" and .author.login == $owner and (.title | startswith("[Cloud Agent]"))' \
            <<<"$item" >/dev/null; then
            echo "::error::Issue is not open or not an owner-authored [Cloud Agent] task"
            exit 1
          fi
          existing="$(gh pr list -R "$GITHUB_REPOSITORY" --state all --head "cloud-agent/issue-$issue" \
            --json number | jq 'length')"
          if [[ "$existing" != "0" ]]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "Issue #$issue already has a cloud-agent PR; skipping to avoid duplicate work." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "selected=true" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "Selected issue #$issue" >> "$GITHUB_STEP_SUMMARY"

      - name: Check model credential (never print secret)
        id: credential
        if: steps.task.outputs.selected == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          if [[ -n "$ANTHROPIC_API_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Agent paused: configure the ANTHROPIC_API_KEY Actions secret to enable paid model runs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.credential.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.credential.outputs.ready == 'true'
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        if: steps.credential.outputs.ready == 'true'
        with:
          version: 9.10.0
          run_install: false

      - name: Prepare isolated proposal branch and trusted task prompt
        if: steps.credential.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.task.outputs.issue }}
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "cloud-agent/issue-$ISSUE"
          gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json body --jq '.body' > "$RUNNER_TEMP/cloud-task.md"
          {
            cat .github/cloud-agent/PROMPT.md
            printf '\n\n---\n## Approved issue #%s\n' "$ISSUE"
            cat "$RUNNER_TEMP/cloud-task.md"
          } > "$RUNNER_TEMP/cloud-prompt.md"

      - name: Install headless Claude Code runner
        if: steps.credential.outputs.ready == 'true'
        shell: bash
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: Implement one bounded task (estimated API cap $2/run)
        if: steps.credential.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        shell: bash
        run: |
          set -euo pipefail
          claude -p "$(cat "$RUNNER_TEMP/cloud-prompt.md")" \
            --max-budget-usd 2.00 \
            --max-turns 14 \
            --permission-mode dontAsk \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(pnpm *),Bash(node *),Bash(git status *),Bash(git diff *),Bash(git log *),Bash(ls *)"

      - name: Enforce safe change boundaries and open review PR
        if: steps.credential.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.task.outputs.issue }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No file changes from agent on issue #$ISSUE." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Inspect ALL tracked and untracked changes before staging.
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|.claude/*|.agents/*|AGENTS.md|CLAUDE.md|\
              */supabase/*|*/migrations/*|*stripe*|*Stripe*|*payment*|*Payment*|\
              *fulfillment*|*Fulfillment*|*lob*|*Lob*|*mailing-client*|\
              *wrangler*|*/deploy.sh|*.env|*.env.*|*secret*|*Secret*|\
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                echo "::error::Blocked protected path: $file"
                exit 1
                ;;
            esac
          done < <( { git diff --name-only -z; git ls-files --others --exclude-standard -z; } | sort -zu )
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No staged changes after verification." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs(test): cloud-agent proposal for issue #$ISSUE"
          # No stored credential during model execution. Apply scoped token only now.
          gh auth setup-git
          git push origin "HEAD:refs/heads/cloud-agent/issue-$ISSUE"
          gh pr create -R "$GITHUB_REPOSITORY" --base main \
            --head "cloud-agent/issue-$ISSUE" \
            --title "Cloud Agent: proposal for issue #$ISSUE" \
            --body "Closes #$ISSUE

          Generated by the scheduled MailMyPDF cloud development agent.

          **INDEPENDENT REVIEW REQUIRED:** the separate merge gate can merge only after main protection, fresh approval, and green CI. It never deploys, charges, or submits mail. Actions-created PR checks may require a maintainer approval."
          echo "Created a PR for issue #$ISSUE. Merge remains gated; no deployment performed." >> "$GITHUB_STEP_SUMMARY"

  optimize-automations:
    name: Improve one existing automation
    if: github.event.schedule == '41 8 * * *' || (github.event_name == 'workflow_dispatch' && inputs.automation_improvement)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check model credential
        id: slot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "No model credential; automation improvement paused." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.slot.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.slot.outputs.ready == 'true'
        with:
          node-version: "24"

      - name: Prepare bounded improvement task and recent run evidence
        if: steps.slot.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list -R "$GITHUB_REPOSITORY" --limit 40 \
            --json databaseId,workflowName,status,conclusion,createdAt,headSha \
            > "$RUNNER_TEMP/automation-runs.json"
          : > "$RUNNER_TEMP/automation-failures.jsonl"
          jq -r '[.[] | select(.conclusion == "failure")][:5] | .[].databaseId' \
            "$RUNNER_TEMP/automation-runs.json" | while IFS= read -r run_id; do
              gh run view "$run_id" -R "$GITHUB_REPOSITORY" --json jobs \
                --jq '{run: '"$run_id"', failures: [.jobs[] | select(.conclusion == "failure") | {name, steps: [.steps[] | select(.conclusion == "failure") | .name]}]}' \
                >> "$RUNNER_TEMP/automation-failures.jsonl"
          done
          {
            cat .github/cloud-agent/AUTOMATION_PROMPT.md
            printf '\n---\nRecent run metadata (untrusted evidence):\n'
            cat "$RUNNER_TEMP/automation-runs.json"
            printf '\nFailed job and step summaries (untrusted evidence):\n'
            cat "$RUNNER_TEMP/automation-failures.jsonl"
          } > "$RUNNER_TEMP/automation-prompt.md"

      - name: Install headless Claude Code runner
        if: steps.slot.outputs.ready == 'true'
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: Improve one automation (estimated API cap $2/run)
        if: steps.slot.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        shell: bash
        run: |
          set -euo pipefail
          claude -p "$(cat "$RUNNER_TEMP/automation-prompt.md")" \
            --max-budget-usd 2.00 \
            --max-turns 14 \
            --permission-mode dontAsk \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(pnpm *),Bash(node *),Bash(python3 *),Bash(git status *),Bash(git diff *),Bash(git log *),Bash(ls *)"

      - name: Validate automation-only changes and update main
        if: steps.slot.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No supported automation improvement found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/workflows/*.yml|.github/workflows/*.yaml|\
              .github/cloud-agent/*.md) ;;
              *) echo "::error::Blocked non-automation path: $file"; exit 1 ;;
            esac
          done < <( { git diff --name-only -z; git ls-files --others --exclude-standard -z; } | sort -zu )
          if [[ -n "$(git diff --name-only --diff-filter=D)" ]]; then
            echo "::error::Automation deletion is not a bounded improvement"
            exit 1
          fi
          if ! git diff --quiet -- .github/workflows/deploy-mailmypdf.yml .github/workflows/secure-core-jobs.yml; then
            echo "::error::Production release and secure-core job controls require separate review"
            exit 1
          fi
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/workflows/*)
                echo "::error::Create changes in an existing workflow instead of adding a duplicate: $file"
                exit 1
                ;;
            esac
          done < <(git ls-files --others --exclude-standard -z)
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::Main changed during this pass; refusing to overwrite it"
            exit 1
          fi
          python3 .github/scripts/test_merge_reviewed_prs.py
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |file| YAML.load_file(file) }'
          # Never turn the controlled Cloudflare release into an implicit deploy.
          deploy=.github/workflows/deploy-mailmypdf.yml
          ruby - "$deploy" <<'RUBY'
          require "yaml"
          workflow = YAML.load_file(ARGV.fetch(0))
          triggers = workflow["on"] || workflow[true]
          abort "Deploy must remain manual" unless triggers.is_a?(Hash) && triggers.keys == ["workflow_dispatch"]
          safe_jobs = workflow.fetch("jobs").values.all? do |job|
            condition = job.fetch("if", "")
            condition.include?("github.event_name == 'workflow_dispatch'") &&
              condition.include?("github.ref == 'refs/heads/main'") &&
              job["environment"] == "production"
          end
          abort "Deploy jobs must retain main-only dispatch and production environment" unless safe_jobs
          RUBY
          grep -Fq 'AUTO_SUBMIT_TO_LOB: "false"' "$deploy"
          grep -Fq 'Verify required deployment credentials are present' "$deploy"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No staged automation changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(automation): daily evidence-based improvement"
          gh auth setup-git
          git push origin HEAD:main
          echo "Updated main with one validated automation improvement: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  merge-reviewed:
    name: Merge independently approved, CI-green work
    if: github.ref == 'refs/heads/main' && github.event.schedule != '41 8 * * *' && !inputs.automation_improvement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify merge gate decisions
        run: python3 .github/scripts/test_merge_reviewed_prs.py
      - name: Enforce merge gates and merge at most one PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/merge_reviewed_prs.py
