name: Repair shared workflow test contracts

on:
  push:
    paths:
      - ".github/workflows/fix-workflows-test-contracts.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair stale shared workflow test mocks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          durable = Path("packages/workflows/tests/durable-manifest-runner.test.ts")
          text = durable.read_text()
          old = '''  async commit(input: {
    expectedRevision: number | null;
    checkpoint: any;
  }) {
    const actual = this.value?.revision ?? null;
    if (actual !== input.expectedRevision) {
      throw new Error("checkpoint revision conflict");
    }
    this.value = {
      ...input.checkpoint,
      revision: (actual ?? 0) + 1,
    };
    return this.value;
  }'''
          new = '''  async commit(input: {
    expectedRevision: number | null;
    checkpoint: any;
  }): Promise<StoredManifestWorkflowCheckpoint> {
    const actual = this.value?.revision ?? null;
    if (actual !== input.expectedRevision) {
      throw new Error("checkpoint revision conflict");
    }
    const next: StoredManifestWorkflowCheckpoint = {
      ...input.checkpoint,
      revision: (actual ?? 0) + 1,
    };
    this.value = next;
    return next;
  }'''
          if old not in text:
              raise SystemExit("durable mock block not found")
          durable.write_text(text.replace(old, new, 1))

          runtime = Path("packages/workflows/tests/matter-runtime-server.test.ts")
          text = runtime.read_text()
          old_import = '''  type WorkflowRuntimePolicy,
  type WorkflowRuntimeServerDependencies,
  type WorkflowRuntimeStoredDraft,'''
          new_import = '''  type WorkflowRuntimePolicy,
  type WorkflowRuntimeServerDependencies,
  type WorkflowRuntimeStore,
  type WorkflowRuntimeStoredDraft,'''
          if old_import not in text:
              raise SystemExit("runtime type import block not found")
          text = text.replace(old_import, new_import, 1)
          text = text.replace('class MemoryStore implements WorkflowRuntimeServerDependencies["store"] {', 'class MemoryStore implements WorkflowRuntimeStore {', 1)
          runtime.write_text(text)
          PY
      - name: Verify workflows package
        run: pnpm --filter @mailmypdf/workflows test
      - name: Commit verified fixes and remove migration workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/workflows/tests/durable-manifest-runner.test.ts packages/workflows/tests/matter-runtime-server.test.ts
          git rm .github/workflows/fix-workflows-test-contracts.yml
          git commit -m "test: align shared workflow mocks with runtime contracts"
          git push origin HEAD:main
