name: Notice Respond package verification

on:
  push:
    branches: [main]
    paths:
      - 'notice-respond/**'
      - 'packages/design-system/**'
      - 'packages/document-intelligence/**'
      - 'packages/seo/**'
      - 'packages/workflow-ui/**'
      - 'packages/workflows/**'
      - 'packages/packet-builder/**'
      - 'packages/payment-fulfillment/**'
      - 'packages/proof/**'
      - 'packages/workflow-acceptance/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/notice-respond-package-ci.yml'
  pull_request:
    paths:
      - 'notice-respond/**'
      - 'packages/design-system/**'
      - 'packages/document-intelligence/**'
      - 'packages/seo/**'
      - 'packages/workflow-ui/**'
      - 'packages/workflows/**'
      - 'packages/packet-builder/**'
      - 'packages/payment-fulfillment/**'
      - 'packages/proof/**'
      - 'packages/workflow-acceptance/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/notice-respond-package-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build Notice Respond dependencies
        run: |
          pnpm --filter @mailmypdf/core build
          pnpm --filter @mailmypdf/documents build
          pnpm --filter @mailmypdf/mailing-client build
          pnpm --filter @mailmypdf/packet-builder build
          pnpm --filter @mailmypdf/payment-fulfillment build
          pnpm --filter @mailmypdf/proof build
          pnpm --filter @mailmypdf/design-system build
          pnpm --filter @mailmypdf/seo build
          pnpm --filter @mailmypdf/document-intelligence build
          pnpm --filter @mailmypdf/workflows build
          pnpm --filter @mailmypdf/workflow-ui build
      - name: Typecheck Notice Respond
        run: pnpm --filter @mailmypdf/notice-respond typecheck
      - name: Unit tests
        run: pnpm --filter @mailmypdf/notice-respond test
      - name: Acceptance tests
        run: pnpm --filter @mailmypdf/notice-respond test:acceptance
