name: Publications Studio CI

on:
  push:
    branches: [main]
    paths:
      - "packages/autonomous-publishing/**"
      - "pnpm-lock.yaml"
      - "Projects/Publications/**"
      - "mailmypdf/src/lib/publication-*.ts"
      - "mailmypdf/src/routes/_authenticated/admin/publications*"
      - "mailmypdf/src/routes/api/internal/publication-scheduler.ts"
      - "mailmypdf/src/server.ts"
      - "mailmypdf/src/components/authenticated-sidebar.tsx"
      - "mailmypdf/src/lib/workflow-navigation.ts"
      - "mailmypdf/supabase/migrations/*autonomous_publications.sql"
      - "mailmypdf/.env.example"
      - ".github/workflows/publications-studio-ci.yml"
  pull_request:
    paths:
      - "packages/autonomous-publishing/**"
      - "Projects/Publications/**"
      - "mailmypdf/src/lib/publication-*.ts"
      - "mailmypdf/src/routes/_authenticated/admin/publications*"
      - "mailmypdf/src/components/authenticated-sidebar.tsx"
      - "mailmypdf/src/lib/workflow-navigation.ts"
      - "mailmypdf/supabase/migrations/*autonomous_publications.sql"
      - ".github/workflows/publications-studio-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mailmypdf/autonomous-publishing typecheck
      - run: pnpm --filter @mailmypdf/autonomous-publishing test
      - run: pnpm --dir mailmypdf build

