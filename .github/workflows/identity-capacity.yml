name: Shared Intelligence

on:
  push:
    paths:
      - "packages/intelligence/**"
      - "packages/identity-capacity/**"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/identity-capacity.yml"
  pull_request:
    paths:
      - "packages/identity-capacity/**"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/identity-capacity.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mailmypdf/intelligence typecheck
      - run: pnpm turbo test --filter=@mailmypdf/intelligence
      - run: pnpm --filter @mailmypdf/identity-capacity typecheck
      - run: pnpm turbo test --filter=@mailmypdf/identity-capacity
